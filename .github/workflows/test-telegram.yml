name: Test invio Telegram (temporaneo)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Invia messaggio di prova
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node -e "
          fetch('https://api.telegram.org/bot' + process.env.TELEGRAM_BOT_TOKEN + '/sendMessage', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: process.env.TELEGRAM_CHAT_ID,
              text: '✅ Profumotify: secret configurati correttamente! Da domani riceverai qui gli alert sui cali di prezzo.'
            })
          }).then(async res => {
            const body = await res.text();
            console.log('Status:', res.status);
            console.log('Risposta Telegram:', body);
            if (!res.ok) process.exit(1);
          });
          "
