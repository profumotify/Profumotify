name: Debug pagina prodotto (temporaneo)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL della pagina prodotto da ispezionare'
        required: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Ispeziona la pagina
        env:
          TARGET_URL: ${{ github.event.inputs.url }}
        run: node scripts/debug-page.js "$TARGET_URL"
