name: Debug pagina (temporaneo)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa le dipendenze
        run: npm install

      - name: Installa Chromium per Playwright
        run: npx playwright install --with-deps chromium

      - name: Debug pagine
        run: node scripts/debug-page.js
