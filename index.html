<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Profumotify v8.0</title>
<link rel="manifest" href="manifest.json?v=9">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081840.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>

<!-- Splash Screen -->
<div id="splash">
  <div class="splash-rose">🌹</div>
  <div class="splash-title">Profumotify</div>
  <div class="splash-sub">La tua collezione, il tuo stile</div>
  <div class="splash-loader"></div>
</div>

<!-- Login Modal -->
<div class="modal-overlay" id="loginModal">
  <div class="modal" style="max-width:400px;">
    <div class="login-screen" style="min-height:auto; background:none;">
      <div class="login-box" style="border:none; box-shadow:none; padding:0;">
        <h1>🌹 Profumotify v8.0</h1>
        <p class="login-subtitle">Tracker personale per la collezione di profumi</p>
        <div class="login-form">
          <input type="text" id="loginUser" placeholder="Username" value="giancarlo">
          <input type="password" id="loginPass" placeholder="Password" value="">
          <button class="btn btn-primary" onclick="doLogin()">Accedi</button>
          <p class="login-hint">Utenti: giancarlo / ospite<br>Password: bari2024 / ospite</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- App Container (hidden until login) -->
<div id="app-container" style="display:none;">

  <!-- Header -->
  <div class="header">
    <div class="header-brand">
      <span class="rose">🌹</span>
      <h1>Profumotify</h1>
    </div>
    <div class="header-actions">
      <button class="header-btn" onclick="showPriceUpdate()" title="Aggiorna prezzi">💰</button>
      <button class="header-btn" onclick="doLogout()" title="Esci">🚪</button>
    </div>
  </div>

  <!-- User Bar -->
  <div class="user-bar" id="userBar">
    <span class="user-badge" id="userBadge"></span>
    <span style="color:var(--text-muted); font-size:12px;" id="currentDate"></span>
  </div>

  <!-- Weather Bar LIVE -->
  <div class="weather-bar" id="weatherBar">
    <div class="weather-info">
      <span class="weather-icon" id="weatherIcon">⏳</span>
      <div>
        <div class="weather-temp" id="weatherTemp">--°C</div>
        <div class="weather-details" id="weatherDesc">Caricamento meteo...</div>
      </div>
    </div>
    <div class="weather-location">📍 Bari</div>
  </div>

  <!-- Tabs Top (Desktop) -->
  <div class="tabs-top" id="mainTabs">
    <button class="tab active" data-tab="collection" onclick="switchTab('collection')">🌹 Collezione</button>
    <button class="tab" data-tab="wishlist" onclick="switchTab('wishlist')">💎 Wishlist</button>
    <button class="tab" data-tab="advisor" onclick="switchTab('advisor')">🎯 Advisor</button>
    <button class="tab" data-tab="notes" onclick="switchTab('notes')">🌸 Note</button>
    <button class="tab" data-tab="dashboard" onclick="switchTab('dashboard')">📊 Stats</button>
    <button class="tab" data-tab="discovery" onclick="switchTab('discovery')">🔍 Discovery</button>
    <button class="tab" data-tab="diary" onclick="switchTab('diary')">📓 Diario</button>
  </div>

  <!-- Content -->
  <div class="content" id="mainContent">

    <!-- Collection Tab -->
    <div id="tab-collection" class="tab-content">
      <div class="stats-grid" id="statsGrid"></div>
      <input type="text" class="search-box" id="searchBox" placeholder="🔍 Cerca profumo o brand..." oninput="searchPerfumes()">
      <div class="filters" id="typeFilters">
        <button class="filter-chip active" onclick="filterType('all')">Tutti</button>
        <button class="filter-chip" onclick="filterType('arab')">🌙 Arabi</button>
        <button class="filter-chip" onclick="filterType('designer')">✨ Designer</button>
        <button class="filter-chip" onclick="filterType('niche')">💎 Niche</button>
      </div>
      <div class="perfume-grid" id="perfumeGrid"></div>
    </div>

    <!-- Wishlist Tab -->
    <div id="tab-wishlist" class="tab-content" style="display:none;">
      <div id="wishlistContent"></div>
    </div>

    <!-- Advisor Tab -->
    <div id="tab-advisor" class="tab-content" style="display:none;">
      <div id="advisorContent"></div>
    </div>

    <!-- Notes Tab -->
    <div id="tab-notes" class="tab-content" style="display:none;">
      <div id="notesContent"></div>
    </div>

    <!-- Dashboard Tab -->
    <div id="tab-dashboard" class="tab-content" style="display:none;">
      <div id="dashboardContent"></div>
    </div>

    <!-- Discovery Tab -->
    <div id="tab-discovery" class="tab-content" style="display:none;">
      <div id="discoveryContent"></div>
    </div>

    <!-- Diary Tab -->
    <div id="tab-diary" class="tab-content" style="display:none;">
      <div id="diaryContent"></div>
    </div>

  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal" onclick="closeDetailModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeDetailModal()">✕</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <!-- Price Update Modal -->
  <div class="modal-overlay" id="priceModal" onclick="closePriceModal(event)">
    <div class="modal" onclick="event.stopPropagation()" style="max-width:400px;">
      <h2 style="font-family:'Playfair Display',serif; color:var(--accent); margin-bottom:20px; text-align:center;">💰 Aggiornamento Prezzi</h2>
      <div class="price-update-progress">
        <div class="progress-bar"><div class="progress-fill" id="priceProgress" style="width:0%"></div></div>
        <div class="progress-text" id="priceProgressText">0/49 profumi analizzati...</div>
      </div>
      <div class="price-results" id="priceResults"></div>
      <button class="btn btn-outline" onclick="closePriceModal()" style="margin-top:16px; width:100%;">Chiudi</button>
    </div>
  </div>

  <!-- Bottom Nav (Mobile) -->
  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('collection')">
      <span class="icon">🌹</span><span>Collezione</span>
    </button>
    <button class="nav-item" onclick="switchTab('wishlist')">
      <span class="icon">💎</span><span>Wishlist</span>
    </button>
    <button class="nav-item" onclick="switchTab('advisor')">
      <span class="icon">🎯</span><span>Advisor</span>
    </button>
    <button class="nav-item" onclick="switchTab('discovery')">
      <span class="icon">🔍</span><span>Discovery</span>
    </button>
    <button class="nav-item" onclick="switchTab('diary')">
      <span class="icon">📓</span><span>Diario</span>
    </button>
    <button class="nav-item" onclick="switchTab('dashboard')">
      <span class="icon">📊</span><span>Stats</span>
    </button>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

</div>

<script src="data.js?v=9"></script>
<script src="app.js?v=9"></script>
</body>
</html>
