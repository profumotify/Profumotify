<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Profumotify</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081840.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f1a; --bg-card: #1a1a2e; --bg-elevated: #252542;
      --primary: #c9a227; --primary-light: #e8d5a3; --accent: #ff6b9d;
      --text: #e8e8f0; --text-muted: #8888a0; --border: #2a2a45;
      --success: #4ade80; --danger: #f87171; --info: #60a5fa;
      --rose: #e11d48; --gold: #fbbf24;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; overflow-x: hidden;
    }
    /* Splash */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s;
    }
    #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-rose { font-size: 80px; animation: rosePulse 2s ease-in-out infinite; }
    @keyframes rosePulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
    .splash-title { font-family:'Playfair Display',serif; font-size:32px; color:var(--primary); margin-top:16px; }
    .splash-sub { color:var(--text-muted); margin-top:8px; font-size:14px; }
    .splash-loader { width:120px; height:3px; background:var(--border); border-radius:3px; margin-top:24px; overflow:hidden; }
    .splash-loader::after { content:''; display:block; width:0; height:100%; background:var(--primary); animation:load 1.5s ease forwards; }
    @keyframes load { to{width:100%} }

    /* Login Modal (solo per area admin, non in homepage) */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.3s;
    }
    .modal-overlay.active { display: flex; opacity: 1; }
    .modal {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 20px; padding: 32px; width: 90%; max-width: 400px;
      transform: scale(0.9); transition: transform 0.3s;
    }
    .modal-overlay.active .modal { transform: scale(1); }
    .modal h2 { font-family:'Playfair Display',serif; color:var(--primary); margin-bottom:20px; text-align:center; }
    .input-group { margin-bottom:16px; }
    .input-group label { display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:1px; }
    .input-group input {
      width:100%; padding:14px 16px; background:var(--bg); border:1px solid var(--border);
      border-radius:12px; color:var(--text); font-size:15px; outline:none;
      transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: var(--primary); }
    .btn {
      width:100%; padding:14px; border:none; border-radius:12px; font-size:15px; font-weight:600;
      cursor:pointer; transition: all 0.2s; display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn-primary { background: var(--primary); color: #1a1a2e; }
    .btn-primary:hover { background: var(--primary-light); transform: translateY(-1px); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

    /* Header */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,15,26,0.92); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border); padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-brand { display:flex; align-items:center; gap:10px; }
    .header-brand .rose { font-size:28px; }
    .header-brand h1 { font-family:'Playfair Display',serif; font-size:22px; color:var(--primary); }
    .header-actions { display:flex; gap:10px; }
    .header-btn {
      width:40px; height:40px; border-radius:12px; background:var(--bg-elevated);
      border:1px solid var(--border); color:var(--text); display:flex; align-items:center; justify-content:center;
      font-size:18px; cursor:pointer; transition:all 0.2s;
    }
    .header-btn:hover { background:var(--primary); color:#1a1a2e; }

    /* Weather Widget */
    .weather-bar {
      background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-elevated) 100%);
      border-bottom: 1px solid var(--border); padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .weather-info { display:flex; align-items:center; gap:12px; }
    .weather-icon { font-size:32px; }
    .weather-temp { font-size:24px; font-weight:700; color:var(--primary); }
    .weather-details { font-size:12px; color:var(--text-muted); }
    .weather-location { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); }
    .weather-location::before { content:"📍"; }

    /* Tabs */
    .tabs {
      display: flex; gap: 4px; padding: 8px 12px;
      background: var(--bg); border-bottom: 1px solid var(--border);
      overflow-x: auto; scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      padding: 10px 18px; border-radius: 12px; font-size: 13px; font-weight: 500;
      color: var(--text-muted); background: transparent; border: none; cursor: pointer;
      white-space: nowrap; transition: all 0.2s; display:flex; align-items:center; gap:6px;
    }
    .tab.active { background: var(--bg-elevated); color: var(--primary); }
    .tab:hover:not(.active) { color: var(--text); }

    /* Content */
    .content { padding: 16px; max-width: 800px; margin: 0 auto; padding-bottom: 100px; }

    /* Stats Cards */
    .stats-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px;
    }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
      padding: 16px; text-align: center;
    }
    .stat-card .number { font-size: 28px; font-weight: 700; color: var(--primary); }
    .stat-card .label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    /* Filters */
    .filters { display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; scrollbar-width:none; }
    .filters::-webkit-scrollbar { display:none; }
    .filter-chip {
      padding:8px 16px; border-radius:20px; background:var(--bg-elevated); border:1px solid var(--border);
      color:var(--text-muted); font-size:13px; cursor:pointer; white-space:nowrap; transition:all 0.2s;
    }
    .filter-chip.active { background:var(--primary); color:#1a1a2e; border-color:var(--primary); }

    /* Search */
    .search-box {
      width:100%; padding:14px 18px; background:var(--bg-card); border:1px solid var(--border);
      border-radius:14px; color:var(--text); font-size:15px; outline:none; margin-bottom:16px;
    }
    .search-box:focus { border-color:var(--primary); }
    .search-box::placeholder { color:var(--text-muted); }

    /* Perfume Grid */
    .perfume-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:14px; }
    .perfume-card {
      background:var(--bg-card); border:1px solid var(--border); border-radius:16px;
      overflow:hidden; cursor:pointer; transition:all 0.25s; position:relative;
    }
    .perfume-card:hover { transform:translateY(-4px); border-color:var(--primary); box-shadow:0 8px 32px rgba(201,162,39,0.15); }
    .perfume-card.wishlist-active { border-color:var(--accent); }
    .perfume-img-wrap {
      aspect-ratio:1; background:linear-gradient(135deg, #1a1a2e 0%, #252542 100%);
      display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
    }
    .perfume-img-wrap img {
      width:100%; height:100%; object-fit:cover; transition:transform 0.3s;
    }
    .perfume-card:hover .perfume-img-wrap img { transform:scale(1.05); }
    .perfume-img-placeholder {
      font-size:48px; opacity:0.3;
    }
    .perfume-badge {
      position:absolute; top:8px; right:8px; padding:4px 10px; border-radius:20px;
      font-size:11px; font-weight:600;
    }
    .badge-arab { background:rgba(255,107,157,0.9); color:white; }
    .badge-designer { background:rgba(96,165,250,0.9); color:white; }
    .badge-niche { background:rgba(201,162,39,0.9); color:#1a1a2e; }
    .perfume-info { padding:12px; }
    .perfume-brand { font-size:11px; color:var(--primary); text-transform:uppercase; letter-spacing:1px; font-weight:600; }
    .perfume-name { font-size:14px; font-weight:600; margin-top:4px; line-height:1.3; }
    .perfume-meta { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:var(--text-muted); }
    .perfume-price { color:var(--success); font-weight:600; }
    .perfume-rating { display:flex; align-items:center; gap:2px; }
    .star { color: var(--gold); font-size: 11px; }
    .star.empty { color: var(--border); }

    /* Wishlist heart */
    .wishlist-btn {
      position:absolute; top:8px; left:8px; width:32px; height:32px; border-radius:50%;
      background:rgba(0,0,0,0.5); border:none; color:var(--text-muted); font-size:16px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:all 0.2s; backdrop-filter:blur(4px);
    }
    .wishlist-btn.active { color:var(--accent); }
    .wishlist-btn:hover { background:rgba(0,0,0,0.7); transform:scale(1.1); }

    /* Detail Modal */
    .detail-img { width:100%; aspect-ratio:1; background:linear-gradient(135deg, #1a1a2e, #252542); display:flex; align-items:center; justify-content:center; }
    .detail-img img { width:100%; height:100%; object-fit:cover; }
    .detail-img .placeholder { font-size:80px; opacity:0.3; }
    .detail-body { padding:20px; }
    .detail-brand { font-size:12px; color:var(--primary); text-transform:uppercase; letter-spacing:1px; font-weight:600; }
    .detail-name { font-family:'Playfair Display',serif; font-size:24px; margin-top:4px; }
    .detail-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
    .tag { padding:6px 14px; border-radius:20px; font-size:12px; background:var(--bg-elevated); border:1px solid var(--border); }
    .tag.family { color:var(--accent); border-color:rgba(255,107,157,0.3); }
    .tag.season { color:var(--info); border-color:rgba(96,165,250,0.3); }
    .tag.occasion { color:var(--success); border-color:rgba(74,222,128,0.3); }
    .detail-section { margin-top:20px; }
    .detail-section h3 { font-size:14px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
    .notes-grid { display:flex; flex-wrap:wrap; gap:8px; }
    .note-item { padding:8px 14px; border-radius:12px; background:var(--bg-elevated); border:1px solid var(--border); font-size:13px; }
    .note-item.top { border-left:3px solid var(--info); }
    .note-item.heart { border-left:3px solid var(--accent); }
    .note-item.base { border-left:3px solid var(--primary); }
    .detail-price-row { display:flex; align-items:center; justify-content:space-between; margin-top:20px; padding-top:16px; border-top:1px solid var(--border); }
    .detail-price { font-size:28px; font-weight:700; color:var(--success); }
    .detail-actions { display:flex; gap:10px; margin-top:16px; }
    .detail-actions .btn { flex:1; }

    /* Wishlist Tab */
    .wishlist-item {
      display:flex; align-items:center; gap:14px; background:var(--bg-card);
      border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:10px;
    }
    .wishlist-item img { width:60px; height:60px; border-radius:12px; object-fit:cover; background:var(--bg-elevated); }
    .wishlist-item .placeholder { width:60px; height:60px; border-radius:12px; background:var(--bg-elevated); display:flex; align-items:center; justify-content:center; font-size:24px; }
    .wishlist-item-info { flex:1; }
    .wishlist-item-brand { font-size:11px; color:var(--primary); text-transform:uppercase; }
    .wishlist-item-name { font-size:14px; font-weight:600; }
    .wishlist-item-price { color:var(--success); font-weight:600; font-size:14px; }
    .wishlist-item-remove {
      width:36px; height:36px; border-radius:10px; background:var(--bg-elevated); border:1px solid var(--border);
      color:var(--danger); display:flex; align-items:center; justify-content:center; cursor:pointer;
      font-size:16px; transition:all 0.2s;
    }
    .wishlist-item-remove:hover { background:var(--danger); color:white; }
    .wishlist-empty { text-align:center; padding:60px 20px; color:var(--text-muted); }
    .wishlist-empty .icon { font-size:48px; margin-bottom:12px; }

    /* Dashboard */
    .chart-container { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:16px; }
    .chart-title { font-size:14px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:16px; }
    .bar-chart { display:flex; align-items:flex-end; gap:8px; height:120px; }
    .bar-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
    .bar { width:100%; border-radius:8px 8px 0 0; min-height:4px; transition:height 0.5s ease; }
    .bar-label { font-size:10px; color:var(--text-muted); text-align:center; }
    .pie-chart { display:flex; align-items:center; justify-content:center; gap:30px; flex-wrap:wrap; }
    .pie-container { position:relative; width:140px; height:140px; }
    .pie-legend { display:flex; flex-direction:column; gap:8px; }
    .legend-item { display:flex; align-items:center; gap:8px; font-size:13px; }
    .legend-dot { width:12px; height:12px; border-radius:4px; }

    /* Discovery */
    .discovery-section { margin-bottom:24px; }
    .discovery-section h3 { font-size:16px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
    .perfume-row { display:flex; gap:12px; overflow-x:auto; scrollbar-width:none; padding-bottom:8px; }
    .perfume-row::-webkit-scrollbar { display:none; }
    .perfume-row .perfume-card { min-width:140px; flex-shrink:0; }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(15,15,26,0.95); backdrop-filter: blur(20px);
      border-top: 1px solid var(--border); padding: 8px 0 24px;
      display: flex; justify-content: space-around; z-index: 100;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 6px 12px; border-radius: 12px; color: var(--text-muted);
      font-size: 11px; cursor: pointer; transition: all 0.2s; border: none; background: none;
    }
    .nav-item .icon { font-size: 22px; }
    .nav-item.active { color: var(--primary); }
    .nav-item:hover:not(.active) { color: var(--text); }

    /* Toast */
    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 24px; font-size: 14px; z-index: 2000; opacity: 0; transition: all 0.3s;
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Price Update Modal */
    .price-update-progress { margin:20px 0; }
    .progress-bar { height:8px; background:var(--bg); border-radius:4px; overflow:hidden; }
    .progress-fill { height:100%; background:var(--primary); border-radius:4px; transition:width 0.3s; }
    .progress-text { text-align:center; margin-top:8px; font-size:13px; color:var(--text-muted); }
    .price-results { max-height:300px; overflow-y:auto; margin-top:16px; }
    .price-result-item { display:flex; justify-content:space-between; padding:10px; border-radius:10px; margin-bottom:6px; background:var(--bg); }
    .price-result-item .change-up { color:var(--danger); }
    .price-result-item .change-down { color:var(--success); }

    /* Animations */
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeIn 0.4s ease forwards; }

    /* Responsive */
    @media (min-width: 768px) {
      .perfume-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
      .stats-grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>

<!-- Splash Screen -->
<div id="splash">
  <div class="splash-rose">🌹</div>
  <div class="splash-title">Profumotify</div>
  <div class="splash-sub">La tua collezione, il tuo stile</div>
  <div class="splash-loader"></div>
</div>

<!-- Login Modal (solo per funzioni admin, non obbligatorio) -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <h2>🔐 Accesso Admin</h2>
    <div class="input-group">
      <label>Username</label>
      <input type="text" id="loginUser" placeholder="giancarlo">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">Accedi</button>
    <button class="btn btn-outline" onclick="closeLogin()" style="margin-top:10px;">Annulla</button>
  </div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-brand">
    <span class="rose">🌹</span>
    <h1>Profumotify</h1>
  </div>
  <div class="header-actions">
    <button class="header-btn" onclick="showLogin()" title="Admin">🔐</button>
    <button class="header-btn" onclick="updatePrices()" title="Aggiorna prezzi">💰</button>
  </div>
</div>

<!-- Weather -->
<div class="weather-bar">
  <div class="weather-info">
    <span class="weather-icon" id="weatherIcon">☀️</span>
    <div>
      <div class="weather-temp" id="weatherTemp">--°C</div>
      <div class="weather-details" id="weatherDesc">Caricamento meteo...</div>
    </div>
  </div>
  <div class="weather-location">Bari</div>
</div>

<!-- Tabs -->
<div class="tabs" id="mainTabs">
  <button class="tab active" data-tab="collection" onclick="switchTab('collection')">🌹 Collezione</button>
  <button class="tab" data-tab="wishlist" onclick="switchTab('wishlist')">💎 Wishlist</button>
  <button class="tab" data-tab="notes" onclick="switchTab('notes')">🌸 Note</button>
  <button class="tab" data-tab="dashboard" onclick="switchTab('dashboard')">📊 Dashboard</button>
  <button class="tab" data-tab="discovery" onclick="switchTab('discovery')">🔍 Discovery</button>
</div>

<!-- Content -->
<div class="content" id="mainContent">
  <!-- Collection Tab -->
  <div id="tab-collection" class="tab-content">
    <div class="stats-grid">
      <div class="stat-card"><div class="number" id="statTotal">49</div><div class="label">Profumi Totali</div></div>
      <div class="stat-card"><div class="number" id="statArab">28</div><div class="label">Arabi</div></div>
      <div class="stat-card"><div class="number" id="statDesigner">15</div><div class="label">Designer</div></div>
      <div class="stat-card"><div class="number" id="statNiche">6</div><div class="label">Niche</div></div>
    </div>
    <input type="text" class="search-box" id="searchBox" placeholder="🔍 Cerca profumo o brand..." oninput="searchPerfumes()">
    <div class="filters" id="typeFilters">
      <button class="filter-chip active" onclick="filterType('all')">Tutti</button>
      <button class="filter-chip" onclick="filterType('arab')">🌙 Arabi</button>
      <button class="filter-chip" onclick="filterType('designer')">✨ Designer</button>
      <button class="filter-chip" onclick="filterType('niche')">💎 Niche</button>
    </div>
    <div class="perfume-grid" id="perfumeGrid"></div>
  </div>

  <!-- Wishlist Tab -->
  <div id="tab-wishlist" class="tab-content" style="display:none;">
    <div id="wishlistContent"></div>
  </div>

  <!-- Notes Tab -->
  <div id="tab-notes" class="tab-content" style="display:none;">
    <div id="notesContent"></div>
  </div>

  <!-- Dashboard Tab -->
  <div id="tab-dashboard" class="tab-content" style="display:none;">
    <div id="dashboardContent"></div>
  </div>

  <!-- Discovery Tab -->
  <div id="tab-discovery" class="tab-content" style="display:none;">
    <div id="discoveryContent"></div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal" style="max-width:500px; max-height:90vh; overflow-y:auto;">
    <div id="detailContent"></div>
  </div>
</div>

<!-- Price Update Modal -->
<div class="modal-overlay" id="priceModal">
  <div class="modal">
    <h2>💰 Aggiornamento Prezzi</h2>
    <div class="price-update-progress">
      <div class="progress-bar"><div class="progress-fill" id="priceProgress" style="width:0%"></div></div>
      <div class="progress-text" id="priceProgressText">0/49 profumi analizzati...</div>
    </div>
    <div class="price-results" id="priceResults"></div>
    <button class="btn btn-outline" onclick="closePriceModal()" style="margin-top:16px;">Chiudi</button>
  </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <button class="nav-item active" onclick="switchTab('collection')">
    <span class="icon">🌹</span>
    <span>Collezione</span>
  </button>
  <button class="nav-item" onclick="switchTab('wishlist')">
    <span class="icon">💎</span>
